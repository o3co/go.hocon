# E20: fractional duration × unit is exact decimal arithmetic.
# Lightbend computes (long)(Double.parseDouble("1.001") * 1e9) = 1000999999 ns,
# a float artifact; E20 reads the digits exactly, so 1.001s is 1001 ms.
# Expected: `getDuration("t")` == 1001 ms == 1001000000 ns (NOT 1000999999 ns,
# NOT 1000.9999999999999 ms).
t = "1.001s"
