# E21: a duration the implementation cannot represent is an error.
# 10^400 days (integer form) overflows int64 / u64 nanoseconds and the double
# range alike. Lightbend also errors here (Long.parseLong overflow), so this
# case is parity; ud13 is the fractional form, where Lightbend saturates.
# Expected: `getDuration("t")` raises an error (every implementation).
