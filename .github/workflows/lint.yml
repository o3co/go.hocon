name: Lint

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

      # adapters/ is a nested module, invisible to the root run above.
      # The config is still the repository root's .golangci.yml, which
      # golangci-lint finds by searching parent directories.
      - name: golangci-lint (adapters)
        run: golangci-lint run --timeout=5m
        working-directory: adapters
