name: Release

on:
  push:
    tags:
      # Core releases. A nested-module tag (adapters/v*) does not match:
      # the * in a tag filter never matches /.
      - "v*"
      # Releases of the nested adapters module.
      - "adapters/v*"

permissions:
  contents: write

jobs:
  proxy-fetch:
    name: Trigger Go module proxy indexing
    if: ${{ !startsWith(github.ref_name, 'adapters/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch via GOPROXY
        run: |
          VERSION="${GITHUB_REF_NAME}"
          MODULE="github.com/o3co/go.hocon"
          echo "Triggering proxy fetch for ${MODULE}@${VERSION}"
          curl -sSf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info" | jq .

      - name: Fetch via sum database
        run: |
          VERSION="${GITHUB_REF_NAME}"
          MODULE="github.com/o3co/go.hocon"
          curl -sSf "https://sum.golang.org/lookup/${MODULE}@${VERSION}" || true

      - name: Extract CHANGELOG section for this tag
        # Pulls the section between `## [VERSION]` and the next `## [`
        # from CHANGELOG.md, so the GitHub Release body matches what's
        # already committed and reviewed. Strips the closing version
        # header so the body ends at the previous section's separator.
        #
        # Uses `index($0, str) == 1` (prefix match) rather than awk regex
        # so SemVer build metadata (`+...`) and other regex metacharacters
        # in version strings can't break or overmatch the section header.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { flag=0 }
            flag
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG section found for v${VERSION}; aborting release so an empty body doesn't ship"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          # Don't fail the workflow if the release already exists
          # (covers retroactive `gh release create` runs from this PR
          # and any future case where the tag's release was created
          # manually before the workflow ran).
          fail_on_unmatched_files: false
          make_latest: true

  # The adapters/ nested module is versioned by its own adapters/v* tags
  # (Go's convention for a module in a subdirectory). Same proxy fetch and
  # sum-database verification as the core job; no GitHub Release is created —
  # adapters changes are documented in the repository CHANGELOG and covered
  # by the core release notes.
  #
  # No checkout, no write: this job only talks to the proxy and builds the
  # published module in a scratch directory.
  proxy-fetch-adapters:
    name: Trigger Go module proxy indexing (adapters)
    if: ${{ startsWith(github.ref_name, 'adapters/') }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Fetch via GOPROXY
        run: |
          VERSION="${GITHUB_REF_NAME#adapters/}"
          MODULE="github.com/o3co/go.hocon/adapters"
          echo "Triggering proxy fetch for ${MODULE}@${VERSION}"
          curl -sSf "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info" | jq .

      - name: Fetch via sum database
        run: |
          VERSION="${GITHUB_REF_NAME#adapters/}"
          MODULE="github.com/o3co/go.hocon/adapters"
          curl -sSf "https://sum.golang.org/lookup/${MODULE}@${VERSION}" || true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      # The real verification. Everything above only asks the proxy to index
      # the tag; it says nothing about whether the module compiles for a
      # consumer. This builds the published module exactly as `go get` would
      # deliver it — no checkout, no replace directive, the core resolved from
      # the require — so a release cut from a stale branch, or an adapters tag
      # pushed before the core tag it needs, fails here instead of reaching
      # users.
      - name: Build the published module as a consumer would
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#adapters/}"
          MODULE="github.com/o3co/go.hocon/adapters"
          mkdir -p /tmp/adapters-consumer && cd /tmp/adapters-consumer
          go mod init consumer
          for pkg in env jsonc properties toml yaml; do
            printf 'package main\nimport _ "%s/%s"\n' "$MODULE" "$pkg" > "use_${pkg}.go"
          done
          printf 'package main\nfunc main() {}\n' > main.go

          # Retry, because this workflow races the tag that triggered it. Until
          # the proxy has indexed the nested module, `go get` does not fail —
          # it falls back to the parent module and reports that
          # github.com/o3co/go.hocon does not contain package .../adapters,
          # which reads like a packaging mistake and is not one. Runs 1 and 2
          # of adapters/v1.12.0 failed exactly that way; run 3, six minutes
          # later, resolved the module.
          for attempt in 1 2 3 4 5 6; do
            if go get "${MODULE}@${VERSION}"; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::${MODULE}@${VERSION} did not become resolvable; the tag may be missing or the module broken"
              exit 1
            fi
            echo "not resolvable yet (attempt ${attempt}/6) — the proxy is probably still indexing; retrying in 60s"
            sleep 60
          done

          # Required, and the reason this job has failed since
          # adapters/v1.11.0. `go get MODULE@VERSION` records that module and
          # nothing else: the go.sum entries for the packages it imports —
          # the core module, go-toml, go-yaml — are never written, so the
          # build below fails on every one of them. Creating the import files
          # first does not help; only resolving the graph does.
          go mod tidy

          go build ./...
