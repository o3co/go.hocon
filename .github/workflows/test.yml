name: Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    name: go${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "1.25"]
        os: [ubuntu-latest]
        include:
          - go: "1.25"
            os: macos-latest
          - go: "1.25"
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Cache expected JSON
        uses: actions/cache@v5
        with:
          path: |
            testdata/expected
            .xx-hocon-version
          key: xx-hocon-expected-${{ hashFiles('.xx-hocon-version') }}
          restore-keys: xx-hocon-expected-

      - name: Fetch expected JSON
        run: make testdata

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

      - name: Test with coverage
        if: matrix.go == '1.25' && matrix.os == 'ubuntu-latest'
        # -coverpkg=./... measures coverage of all packages, not just the test
        # package's own statements. Without it, tests in `package hocon_test`
        # (root) that exercise `internal/lexer` / `internal/parser` are not
        # counted toward those packages' coverage, leading to false-negative
        # codecov reports on PRs that add cross-package integration tests.
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage to Codecov
        if: matrix.go == '1.25' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: o3co/go.hocon
          files: coverage.out
          fail_ci_if_error: false

  # adapters/ is a nested module, so the root job's ./... stops at its
  # boundary and never tests it. Its fixtures
  # (adapters/testdata-format-ingestion/) are committed to git — unlike the
  # root module's fetched testdata/expected/ — so no fetch or cache step is
  # needed here. Matrix: oldest supported (per adapters/go.mod) plus current
  # stable, Linux only; the module is a thin layer over the fully
  # matrix-tested core.
  test-adapters:
    name: adapters go${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.25"]
    defaults:
      run:
        working-directory: adapters

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

  # The release check the adapters/go.mod comment prescribes: consumers
  # ignore a dependency's replace directive and build against the published
  # core named in the require — not against this checkout. Dropping the
  # replace here reproduces the consumer's view, so a stale require version
  # fails CI instead of shipping (v1.10.0 shipped requiring a core that
  # predates the API the adapters use; every consumer build broke while the
  # in-repo build stayed green).
  test-adapters-consumer:
    name: adapters without replace (published core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build against the published core
        working-directory: adapters
        run: |
          go mod edit -dropreplace=github.com/o3co/go.hocon
          GOFLAGS=-mod=mod go build ./...
