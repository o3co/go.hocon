name: Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# The repository default is write, so a workflow that says nothing gets it.
# Nothing here writes; Codecov uploads with CODECOV_TOKEN, not with OIDC.
permissions:
  contents: read

jobs:
  test:
    name: go${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "1.25"]
        os: [ubuntu-latest]
        include:
          - go: "1.25"
            os: macos-latest
          - go: "1.25"
            os: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}

      - name: Cache expected JSON
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            testdata/expected
            .xx-hocon-version
          key: xx-hocon-expected-${{ hashFiles('.xx-hocon-version') }}
          restore-keys: xx-hocon-expected-

      - name: Fetch expected JSON
        run: make testdata

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

      - name: Test with coverage
        if: matrix.go == '1.25' && matrix.os == 'ubuntu-latest'
        # -coverpkg=./... measures coverage of all packages, not just the test
        # package's own statements. Without it, tests in `package hocon_test`
        # (root) that exercise `internal/lexer` / `internal/parser` are not
        # counted toward those packages' coverage, leading to false-negative
        # codecov reports on PRs that add cross-package integration tests.
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload coverage to Codecov
        if: matrix.go == '1.25' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: o3co/go.hocon
          files: coverage.out
          fail_ci_if_error: false

  # adapters/ is a nested module, so the root job's ./... stops at its
  # boundary and never tests it. Its fixtures
  # (adapters/testdata-format-ingestion/) are committed to git — unlike the
  # root module's fetched testdata/expected/ — so no fetch or cache step is
  # needed here. Matrix: oldest supported (per adapters/go.mod) plus current
  # stable, Linux only; the module is a thin layer over the fully
  # matrix-tested core.
  test-adapters:
    name: adapters go${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.25"]
    defaults:
      run:
        working-directory: adapters

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 ./...

  # The check the adapters/go.mod comment prescribes: consumers ignore a
  # dependency's replace directive and build against the published core named
  # in the require — not against this checkout. Dropping the replace here
  # reproduces the consumer's view, so a stale require fails CI instead of
  # shipping (v1.10.0 shipped requiring a core that predates the API the
  # adapters use; every consumer build broke while the in-repo build stayed
  # green).
  #
  # The required version may legitimately not exist yet: a PR that changes the
  # core and the adapters together bumps the require to the version that will
  # be tagged, which the proxy has never heard of. That case warns and skips —
  # it is the release job that runs this check for real, after the tag exists.
  # Refusing it here instead would make the prescribed workflow unmergeable.
  test-adapters-consumer:
    name: adapters without replace (published core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"

      - name: Build against the published core
        working-directory: adapters
        run: |
          set -euo pipefail
          MODULE=github.com/o3co/go.hocon
          VERSION="$(go list -m -f '{{.Version}}' "$MODULE")"
          echo "adapters/go.mod requires ${MODULE}@${VERSION}"

          if ! curl -sfI -o /dev/null "https://proxy.golang.org/${MODULE}/@v/${VERSION}.info"; then
            echo "::warning::${MODULE}@${VERSION} is not on the module proxy yet, so the \
          consumer build cannot run. This is expected on a PR that bumps the require ahead \
          of the tag; the release workflow runs this check once the tag exists."
            exit 0
          fi

          go mod edit -dropreplace="$MODULE"
          # go test, not go build: it compiles the test files too, so a core
          # change that only breaks tests is caught here as well.
          GOFLAGS=-mod=mod go test -count=1 ./...
